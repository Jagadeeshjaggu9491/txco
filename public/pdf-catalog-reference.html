productDetails":{"plug-gaskets":{"title":"PLUG GASKETS","image":"/images/product-detials-images/gaskets-product-detials-place-holder-img.png","downloadTitle":"Plug Gaskets Catalog","sections":[{"heading":"INDUSTRIAL EQUIPMENT & PIPING PLUG GASKETS","paragraphs":["Plug Gaskets are sealing elements designed to provide a reliable seal between a plug and its mating surface, preventing leakage of fluids or gases in industrial equipment and piping systems.","Provide secure sealing under varying pressure and temperature conditions.","Available in suitable metallic and non-metallic materials based on the application. Material selection can be matched to process media, chemical exposure and operating conditions.","Designed for simple installation and replacement, helping reduce maintenance downtime.","Suitable for applications requiring reliable containment and resistance to pressure fluctuations, temperature changes and corrosive environments.","Commonly used across oil & gas, petrochemical, chemical, refining and general process industries."],"showAssemblyDiagram":true,"diagramType":"weld-lip"}]}}},"flanges":{"parentCategoryTitle":"PRODUCTS","parentCategoryHref":"/products","subcategoryTitle":"Flanges","productsList":[{"id":"about-flanges","title":"ABOUT FLANGES","downloadTitle":"Flanges Catalog"},{"id":"weld-neck-flanges","title":"WELD NECK FLANGES","downloadTitle":"Weld Neck Flanges Catalog"},{"id":"slip-on-flanges","title":"SLIP-ON FLANGES","downloadTitle":"Slip-On Flanges Catalog"},{"id":"blind-flanges","title":"BLIND FLANGES","downloadTitle":"Blind Flanges Catalog"},{"id":"socket-weld-flanges","title":"SOCKET WELD FLANGES","downloadTitle":"Socket Weld Flanges Catalog"},{"id":"lap-joint-flanges","title":"LAP JOINT FLANGES","downloadTitle":"Lap Joint Flanges Catalog"},{"id":"threaded-screwed-flanges","title":"THREADED / SCREWED FLANGES","downloadTitle":"Threaded Flanges Catalog"},{"id":"orifice-flanges","title":"ORIFICE FLANGES","downloadTitle":"Orifice Flanges Catalog"},{"id":"custom-flanges","title":"CUSTOM FLANGES","downloadTitle":"Custom & Subsea Flanges Catalog"}],"productDetails":{"about-flanges":{"title":"TXCO INDUSTRIAL FLANGES","image":"/images/product-detials-images/flanges-1.avif","downloadTitle":"Flanges Catalog","sections":[{"heading":"TXCO INDUSTRIAL FLANGES","paragraphs":["Precision-engineered flange solutions for demanding industrial applications.","TXCO Sealing Products Private Limited is a manufacturer of industrial sealing products and precision-engineered components serving the oil & gas, petrochemical, refining, chemical, power and process industries.","TXCO manufactures and supplies industrial flanges in stainless steel, duplex, super duplex and nickel-based and special alloys, in accordance with applicable international standards, approved drawings and customer or project specifications.","TXCO operates under certified quality management systems and is committed to manufacturing in accordance with applicable ASME and API requirements. Our quality systems, manufacturing controls and inspection processes are aligned with the requirements of the relevant product and project specifications.","Our flange manufacturing focuses on dimensional accuracy, material integrity, controlled machining, traceability and dependable sealing performance. Our experience in industrial gaskets also gives us a practical understanding of the flange, gasket and bolting interface.","PRECISION ENGINEERED. STANDARDS DRIVEN. QUALITY CONTROLLED."],"showAssemblyDiagram":true,"diagramType":"weld-lip"},{"heading":"WHAT IS A FLANGE?","paragraphs":["A flange is a mechanical component used to create a bolted, detachable connection between piping and equipment such as pipes, valves, pumps, pressure vessels, heat exchangers and other process equipment.","A typical flanged joint consists of a flange, gasket, bolting and mating flange. The flanges provide the mechanical connection and transmit the required bolt load, while the gasket is compressed between the mating faces to create a pressure-tight seal.","Reliable flange performance depends on material, dimensions, pressure class, facing, surface finish, bore and bolt-hole accuracy, RTJ groove geometry where applicable, gasket compatibility and operating conditions."]},{"heading":"FLANGE FACING TYPES","table":{"headers":["FACING TYPE","DESCRIPTION","APPLICATIONS"],"rows":[{"code":"Raised Face (RF)","figureType":"flange-wn-std","description":"Raised surface area concentrated on gasket contact; smooth or serrated finish.","thickness":"General industrial, process and chemical piping","reweld":"ASME B16.5 / B16.47","radial":"Smooth or spiral/concentric serrated finish"},{"code":"Flat Face (FF)","figureType":"flange-wn-large","description":"Full flat mating surface across entire flange face, used with full-face gaskets.","thickness":"Cast-iron equipment, FRP and low-pressure systems","reweld":"ASME B16.5","radial":"Prevents flange cracking under bolting load"},{"code":"Ring Type Joint (RTJ)","figureType":"flange-wn-api","description":"Machined metallic groove for metallic RTJ ring gaskets (R, RX, BX).","thickness":"High-pressure, high-temperature and subsea pipelines","reweld":"ASME B16.5 / API 6A","radial":"Class 300 to 2500 & API up to 20,000 psi"}],"footnote":"Supplied in full compliance with ASME B16.5, ASME B16.47, and API 6A specifications."}},{"heading":"STANDARDS WE FOLLOW","table":{"headers":["STANDARD CODE","ORGANIZATION / GOVERNING BODY","SCOPE & COVERAGE"],"rows":[{"code":"ASME B16.5","figureType":"flange-wn-std","description":"American Society of Mechanical Engineers","thickness":"Pipe Flanges and Flanged Fittings: NPS 1/2 through NPS 24 Metric/Inch Standard","reweld":"Class 150 - 2500","radial":"Global oil & gas standard"},{"code":"ASME B16.47","figureType":"flange-wn-large","description":"American Society of Mechanical Engineers","thickness":"Large Diameter Steel Flanges: NPS 26 through NPS 60 (Series A and Series B)","reweld":"Class 75 - 900","radial":"Pipelines and pressure vessels"},{"code":"ASME B16.48","figureType":"spec-fig8","description":"American Society of Mechanical Engineers","thickness":"Line Blanks (Spectacle Blinds, Spades, and Spacers)","reweld":"Class 150 - 2500","radial":"Piping positive isolation"},{"code":"API 6A","figureType":"flange-wn-api","description":"American Petroleum Institute","thickness":"Wellhead and Christmas Tree Equipment Flanges","reweld":"2,000 to 20,000 psi","radial":"Upstream oil & gas and subsea"},{"code":"MSS SP-44","figureType":"flange-wn-std","description":"Manufacturers Standardization Society","thickness":"Steel Pipeline Flanges","reweld":"Class 150 - 900","radial":"Cross-country transmission pipelines"},{"code":"EN Standards","figureType":"flange-wn-std","description":"European Standards (EN 1092-1)","thickness":"Flanges and their joints - Circular flanges for pipes, valves, fittings","reweld":"PN 2.5 to PN 400","radial":"European industrial piping"},{"code":"DIN Standards","figureType":"flange-wn-std","description":"Deutsches Institut für Normung","thickness":"German industrial flange standards (DIN 2631 to DIN 2638)","reweld":"PN 6 to PN 400","radial":"Process and chemical plants"},{"code":"JIS Standards","figureType":"flange-wn-std","description":"Japanese Industrial Standards","thickness":"Steel pipe flanges (JIS B2220)","reweld":"5K to 63K","radial":"Japanese & Asian equipment"},{"code":"BS Standards","figureType":"flange-wn-std","description":"British Standards Institution","thickness":"Flanges and bolting for pipes, valves, and fittings (BS 4504, BS 10)","reweld":"Table D - T / PN ratings","radial":"UK and Commonwealth systems"}],"footnote":"Flanges can also be manufactured according to other international standards and customer drawings."}},{"heading":"FLANGE MATERIALS","table":{"headers":["MATERIAL GROUP","TYPICAL GRADES & SPECIFICATIONS","COMMON SERVICE APPLICATIONS"],"rows":[{"code":"Austenitic Stainless Steel","figureType":"mat-ss316","description":"ASTM A182 F304/304L, F316/316L, F321, F347","thickness":"Corrosion resistance across general chemical, food, pharmaceutical and cryogenic service","reweld":"Cryogenic to +600°C","radial":"Broad chemical compatibility"},{"code":"High-Temperature Stainless","figureType":"mat-ss316","description":"ASTM A182 F310, F321H, F347H","thickness":"Elevated-temperature petrochemical, refining, furnace and thermal fluid applications","reweld":"Up to +800°C","radial":"High creep and oxidation resistance"},{"code":"Duplex Stainless Steel","figureType":"mat-duplex","description":"ASTM A182 F51 / UNS S31803 / S32205 (2205)","thickness":"High mechanical strength with resistance to stress corrosion cracking and pitting in chloride environments","reweld":"-50°C to +300°C","radial":"Offshore, marine and chemical"},{"code":"Super Duplex Stainless","figureType":"mat-sduplex","description":"ASTM A182 F53 / UNS S32750 (2507), F55 / UNS S32760","thickness":"Severe offshore, subsea, marine and high-chloride services requiring PREN ≥ 42","reweld":"-50°C to +300°C","radial":"High chloride and sour service"},{"code":"Nickel Alloys","figureType":"mat-inconel","description":"Inconel 600, 625, 718 / UNS N06600, N06625, N07718","thickness":"Demanding chemical, offshore, high-temperature, sour gas and severe-service applications","reweld":"-196°C to +980°C","radial":"Severe sour gas H2S and hot acids"},{"code":"Nickel-Iron-Chromium","figureType":"mat-incoloy","description":"Incoloy 800, 825 / UNS N08800, N08825","thickness":"High-temperature, oxidation, carburization and acid-corrosion environments","reweld":"-196°C to +540°C","radial":"Sulfuric and phosphoric acids"},{"code":"Nickel-Copper Alloys","figureType":"rtj-material","description":"Monel 400, K-500 / UNS N04400, N05500","thickness":"Marine environments, seawater systems, chemical processing and hydrofluoric acid service","reweld":"-196°C to +480°C","radial":"Hydrofluoric acid and marine"},{"code":"Special Alloys","figureType":"mat-hastelloy","description":"Hastelloy C-276, Alloy 20, Titanium Gr. 2 / UNS N10276, N08020, R50400","thickness":"Severe chemical, oxidizing acids, bleaching, wet chlorine and aggressive process conditions","reweld":"Application specific","radial":"Severe acids and wet chlorine"}],"footnote":"Materials supplied with full traceability, Positive Material Identification (PMI), and EN 10204 3.1 Mill Test Certificates."}}]},"weld-neck-flanges":{"title":"WELD NECK FLANGES","image":"/images/product-detials-images/flanges-1.avif","downloadTitle":"Weld Neck Flanges Catalog","sections":[{"heading":"WELD NECK FLANGES — HIGH-INTEGRITY FLANGES FOR CRITICAL SERVICE","paragraphs":["Weld Neck Flanges have a long, tapered hub and are connected to the pipe by butt welding. The tapered hub provides a gradual transition between the flange and pipe and helps distribute stresses at the flange-to-pipe connection.","The bore can be matched to the pipe bore to maintain a smooth flow path and reduce turbulence and localized erosion."],"showAssemblyDiagram":true,"diagramType":"weld-lip","bulletsIntro":"Typical Applications:","bullets":["Oil & gas","Refineries and petrochemical plants","Chemical processing","Power generation","Pressure vessels and heat exchangers","High-pressure and high-temperature piping"]}]},"slip-on-flanges":{"title":"SLIP-ON FLANGES","image":"/images/product-detials-images/flanges-2.avif","downloadTitle":"Slip-On Flanges Catalog","sections":[{"heading":"SLIP-ON FLANGES — PRACTICAL FLANGE CONNECTIONS FOR INDUSTRIAL PIPING","paragraphs":["Slip-On Flanges fit over the outside diameter of the pipe and are normally welded internally and externally. They offer a practical and economical connection where the service conditions permit their use. They are commonly selected for general industrial and utility piping."],"showAssemblyDiagram":true,"diagramType":"weld-lip","bulletsIntro":"Typical Applications:","bullets":["Process piping","Utility systems","General industrial piping","Equipment connections","Water and utility services"]}]},"blind-flanges":{"title":"BLIND FLANGES","image":"/images/product-detials-images/flanges-product-detials-place-holder-img.png","downloadTitle":"Blind Flanges Catalog","sections":[{"heading":"BLIND FLANGES — POSITIVE CLOSURE AND MECHANICAL ISOLATION","paragraphs":["A Blind Flange is a solid flange with bolt holes but no central bore. It is used to close the end of a piping system, valve, pressure vessel or equipment nozzle. Blind flanges provide positive isolation and allow a connection to be reopened for inspection, maintenance, testing or future expansion."],"showAssemblyDiagram":true,"diagramType":"weld-lip","bulletsIntro":"Typical Applications:","bullets":["Pipeline isolation","Pressure vessel nozzles","Equipment connections","Hydrostatic testing","Maintenance and shutdowns","Pipeline termination"]}]},"socket-weld-flanges":{"title":"SOCKET WELD FLANGES","image":"/images/product-detials-images/flanges-product-detials-place-holder-img.png","downloadTitle":"Socket Weld Flanges Catalog","sections":[{"heading":"SOCKET WELD FLANGES — COMPACT FLANGES FOR SMALL-BORE PIPING","paragraphs":["Socket Weld Flanges have a machined socket into which the pipe is inserted before welding. They are primarily used for smaller-diameter piping and are suitable for selected high-pressure applications within the applicable design rating."],"showAssemblyDiagram":true,"diagramType":"weld-lip","bulletsIntro":"Typical Applications:","bullets":["Small-bore piping","High-pressure piping","Instrumentation systems","Chemical processing","Hydraulic systems","Process piping"]}]},"lap-joint-flanges":{"title":"LAP JOINT FLANGES","image":"/images/product-detials-images/flanges-product-detials-place-holder-img.png","downloadTitle":"Lap Joint Flanges Catalog","sections":[{"heading":"LAP JOINT FLANGES — FLEXIBLE ALIGNMENT FOR MAINTENANCE-INTENSIVE SYSTEMS","paragraphs":["Lap Joint Flanges are used with a compatible Stub End. The pipe is welded to the stub end while the flange remains free to rotate around it, allowing convenient bolt-hole alignment during assembly. This configuration is useful where frequent dismantling or maintenance is required."],"showAssemblyDiagram":true,"diagramType":"weld-lip","bulletsIntro":"Typical Applications:","bullets":["Chemical processing","Corrosive services","Stainless-steel piping","Duplex and special-alloy piping","Process plants","Maintenance-intensive systems"]}]},"threaded-screwed-flanges":{"title":"THREADED (SCREWED) FLANGES","image":"/images/product-detials-images/flanges-product-detials-place-holder-img.png","downloadTitle":"Threaded Flanges Catalog","sections":[{"heading":"THREADED (SCREWED) FLANGES — FLANGED CONNECTIONS WITHOUT WELDING","paragraphs":["Threaded Flanges, also known as Screwed Flanges, have internal threads that engage with the external threads of the pipe. They can be installed without flange-to-pipe welding and are used for selected applications where welding is impractical, undesirable or restricted. They are generally considered for selected low-pressure or utility services, subject to design requirements."],"showAssemblyDiagram":true,"diagramType":"weld-lip","bulletsIntro":"Typical Applications:","bullets":["Utility systems","Instrumentation","Small-diameter piping","Selected process applications","Applications where welding is restricted"]}]},"orifice-flanges":{"title":"ORIFICE FLANGES","image":"/images/product-detials-images/flanges-product-detials-place-holder-img.png","downloadTitle":"Orifice Flanges Catalog","sections":[{"heading":"ORIFICE FLANGES — PRECISION FLANGES FOR FLOW MEASUREMENT","paragraphs":["Orifice Flanges are specialized flange assemblies used in differential-pressure flow measurement. They incorporate provisions for pressure tapping on either side of an orifice plate. The pressure differential across the orifice is used to determine the process-fluid flow rate."],"showAssemblyDiagram":true,"diagramType":"weld-lip","bulletsIntro":"Typical Applications:","bullets":["Oil & gas","Refineries","Petrochemical plants","Chemical processing","Process plants","Flow measurement systems"]}]},"custom-flanges":{"title":"CUSTOM FLANGES","image":"/images/product-detials-images/flanges-product-detials-place-holder-img.png","downloadTitle":"Custom Flanges Catalog","sections":[{"heading":"ENGINEERED & CUSTOM FLANGES","paragraphs":["TXCO manufactures custom-made flanges to customer drawings and project-specific requirements where standard configurations do not meet the application.","Custom flange solutions can be developed for special dimensions, bore configurations, bolt patterns, thicknesses, facings, RTJ grooves, reducing arrangements, internal bevels and specified stainless, duplex, super duplex or nickel-based alloys.","Each custom requirement is reviewed against the approved drawing, applicable ASME/API or other governing standard, material specification and inspection requirements before manufacture."],"showAssemblyDiagram":true,"diagramType":"weld-lip"}]}}},"monolithic-insulation-joints":{"parentCategoryTitle":"PRODUCTS","parentCategoryHref":"/products","subcategoryTitle":"Monolithic Insulation Joints","productsList":[{"id":"monolithic-insulation-joints","title":"MONOLITHIC INSULATION JOINTS","downloadTitle":"Monolithic Joints Catalog"}],"productDetails":{"monolithic-insulation-joints":{"title":"MONOLITHIC INSULATION JOINTS","image":"/images/product-detials-images/flanges-product-detials-place-holder-img.png","downloadTitle":"Monolithic Insulation Joints Catalog","sections":[{"heading":"MONOLITHIC INSULATION JOINTS","paragraphs":["Monolithic Insulation Joints are pre-fabricated, fully welded, boltless isolating fittings designed to provide electrical isolation between sections of buried, aboveground and submerged pipelines. They prevent the flow of unwanted electrical currents and protect cathodic protection (CP) systems from interference and current loss.","At TXCO Sealing Products Private Limited, monolithic insu nd operating pressure, temperature fluctuations, mechanical wear and corrosive service environments."],"showAssemblyDiagram":true,"diagramType":"weld-lip"},{"heading":"TYPES OF VALVE COMPONENTS","bullets":["Precision O-Rings: Precision-moulded elastomeric sealing rings providing reliable static and dynamic sealing in valve stems, bodies and actuators.","Low-Emission Gland Packing: Engineered braided packing sets designed to minimize fugitive VOC emissions and provide reliable stem sealing in high-pressure and high-temperature valves.","Valve Seats & Inserts: Precision-machined thermoplastic and metallic valve seats ensuring bubble-tight shut-off and wear resistance in ball, gate and globe valves."]},{"heading":"COMPONENT SPECIFICATIONS & PERFORMANCE MATRIX","table":{"headers":["COMPONENT","PRIMARY MATERIALS","TEMPERATURE RANGE","PRESSURE RATING","KEY STANDARDS"],"rows":[{"code":"Precision O-Rings","description":"FFKM, FKM, HNBR, EPDM","thickness":"-50°C to +315°C","reweld":"Up to 10,000 PSI","radial":"NORSOK M-710, ISO 23936-2"},{"code":"Gland Packing","description":"ePTFE, Graphite, Inconel Wire","thickness":"-200°C to +650°C","reweld":"Class 150–2500","radial":"API 622, ISO 15848-1, TA-Luft"},{"code":"Seat Rings & Inserts","description":"PEEK, PCTFE, Devlon V, PTFE","thickness":"-196°C to +260°C","reweld":"Class 150–2500","radial":"API 6D, ASME B16.34"}]}}]},"precision-o-rings":{"title":"PRECISION O-RINGS","image":"/images/product-detials-images/O-Ring-for-Ball-Valve.avif","downloadTitle":"Precision O-Rings Catalog","sections":[{"heading":"PRECISION O-RINGS","paragraphs":["Precision-moulded elastomeric sealing rings providing reliable static and dynamic sealing in valve stems, bodies and actuators.","TXCO precision O-rings are engineered to withstand extreme pressures and prevent rapid gas decompression in harsh operating environments."],"showAssemblyDiagram":true,"diagramType":"weld-lip"}]},"valve-packing":{"title":"LOW-EMISSION GLAND PACKING","image":"/images/product-detials-images/Ball-for-Ball-Valve.avif","downloadTitle":"Gland Packing Catalog","sections":[{"heading":"LOW-EMISSION GLAND PACKING","paragraphs":["Engineered braided packing sets designed to minimize fugitive VOC emissions and provide reliable stem sealing in high-pressure and high-temperature valves."],"showAssemblyDiagram":true,"diagramType":"weld-lip"}]},"valve-seats-inserts":{"title":"VALVE SEATS & INSERTS","image":"/images/product-detials-images/Seat-Insert-for-Ball-Valve.avif","downloadTitle":"Valve Seats Catalog","sections":[{"heading":"VALVE SEATS & INSERTS","paragraphs":["Precision-machined thermoplastic and metallic valve seats ensuring bubble-tight shut-off and wear resistance in ball, gate and globe valves."],"showAssemblyDiagram":true,"diagramType":"weld-lip"}]}}},"commercial-products":{"parentCategoryTitle":"PRODUCTS","parentCategoryHref":"/products","subcategoryTitle":"Commercial Products","productsList":[{"id":"commercial-products-item","title":"COMMERCIAL PRODUCTS","downloadTitle":"Commercial Products Catalog"}],"productDetails":{"commercial-products-item":{"title":"COMMERCIAL PRODUCTS","image":"/images/product-detials-images/Expanding-Gates-and-Through-Conduit-Gates.avif","downloadTitle":"Commercial Products Catalog","sections":[{"heading":"COMMERCIAL SUPPLY & INDUSTRIAL BOLTING","paragraphs":["TXCO supplies standardized commercial pipeline hardware, heavy hex stud bolts, nuts, and pipeline accessories compliant with ASTM A193, ASTM A194, and international fastener specifications."],"showAssemblyDiagram":true,"diagramType":"weld-lip"}]}}}};

    // Point splitting helper
    function splitPointItem(item) {
      if (typeof item !== 'string') return { title: '', desc: item };
      const text = item.trim();

      const colonIdx = text.indexOf(':');
      if (colonIdx > 0 && colonIdx <= 65) {
        return {
          title: text.substring(0, colonIdx).trim(),
          desc: text.substring(colonIdx + 1).trim(),
        };
      }

      const dashMatch = text.match(/^([^\n—–]{3,55})\s+[—–]\s+(.*)$/);
      if (dashMatch) {
        return {
          title: dashMatch[1].trim(),
          desc: dashMatch[2].trim(),
        };
      }

      const keywords = [
        ' designed for ', ' consist of ', ' consists of ', ' engineered for ',
        ' suitable for ', ' provides ', ' commonly used in ', ' commonly used ',
        ' manufactured from ', ' features '
      ];

      for (const kw of keywords) {
        const kwIdx = text.indexOf(kw);
        if (kwIdx >= 15 && kwIdx <= 65) {
          const isActionVerb = kw.includes('designed') || kw.includes('engineered') || kw.includes('manufactured');
          if (isActionVerb) {
            return {
              title: text.substring(0, kwIdx).trim(),
              desc: (text.substring(kwIdx + 1).charAt(0).toUpperCase() + text.substring(kwIdx + 2)).trim(),
            };
          } else {
            return {
              title: (text.substring(0, kwIdx) + kw).trim(),
              desc: text.substring(kwIdx + kw.length).trim(),
            };
          }
        }
      }

      const commaIdx = text.indexOf(',');
      if (commaIdx >= 18 && commaIdx <= 55) {
        return {
          title: text.substring(0, commaIdx).trim(),
          desc: text.substring(commaIdx + 1).trim(),
        };
      }

      if (text.length <= 55) {
        return { title: text, desc: '' };
      }

      const words = text.split(' ');
      if (words.length > 6) {
        return {
          title: words.slice(0, 5).join(' '),
          desc: words.slice(5).join(' '),
        };
      }

      return { title: text, desc: '' };
    }

    function init() {
      renderCategoryTabs();
      selectCategory('metallic-gaskets');
    }

    function setViewMode(mode) {
      currentViewMode = mode;
      document.getElementById('btnDetailedView').classList.toggle('active', mode === 'detailed');
      document.getElementById('btnMatrixView').classList.toggle('active', mode === 'matrix');
      document.getElementById('sidebarContainer').style.display = mode === 'detailed' ? 'block' : 'none';
      document.querySelector('.app-layout').style.gridTemplateColumns = mode === 'detailed' ? '310px minmax(0, 1fr)' : '1fr';

      if (mode === 'detailed') {
        renderProductContent();
      } else {
        renderMatrixView();
      }
    }

    function renderCategoryTabs() {
      const tabsContainer = document.getElementById('categoryTabs');
      const catKeys = Object.keys(CATALOG_DATA);

      tabsContainer.innerHTML = catKeys.map(key => {
        const cat = CATALOG_DATA[key];
        const isActive = key === currentCategoryKey;
        return `<button class="cat-tab ${isActive ? 'active' : ''}" onclick="selectCategory('${key}')">${cat.subcategoryTitle}</button>`;
      }).join('');
    }

    function selectCategory(key) {
      currentCategoryKey = key;
      renderCategoryTabs();

      const cat = CATALOG_DATA[key];
      const navList = document.getElementById('productsListNav');
      const sidebarTitle = document.getElementById('sidebarTitle');

      sidebarTitle.textContent = cat.subcategoryTitle;

      if (cat.productsList && cat.productsList.length > 0) {
        currentProductId = cat.productsList[0].id;
        navList.innerHTML = cat.productsList.map(p => {
          const isActive = p.id === currentProductId;
          return `
            <li>
              <button class="product-nav-btn ${isActive ? 'active' : ''}" onclick="selectProduct('${p.id}')">
                <span>${p.title}</span>
              </button>
            </li>
          `;
        }).join('');
      }

      if (currentViewMode === 'detailed') {
        renderProductContent();
      } else {
        renderMatrixView();
      }
    }

    function selectProduct(id) {
      currentProductId = id;
      const cat = CATALOG_DATA[currentCategoryKey];
      const navList = document.getElementById('productsListNav');

      navList.innerHTML = cat.productsList.map(p => {
        const isActive = p.id === currentProductId;
        return `
          <li>
            <button class="product-nav-btn ${isActive ? 'active' : ''}" onclick="selectProduct('${p.id}')">
              <span>${p.title}</span>
            </button>
          </li>
        `;
      }).join('');

      renderProductContent();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderProductContent() {
      const cat = CATALOG_DATA[currentCategoryKey];
      const product = cat.productDetails[currentProductId] || Object.values(cat.productDetails)[0];
      const main = document.getElementById('mainContent');

      if (!product) {
        main.innerHTML = '<p>No details found.</p>';
        return;
      }

      let html = '';

      // Breadcrumbs
      html += `
        <div class="content-breadcrumbs">
          <span>${cat.parentCategoryTitle || 'PRODUCTS'}</span>
          <span>/</span>
          <span>${cat.subcategoryTitle}</span>
          <span>/</span>
          <span style="color: var(--accent-green);">${product.title}</span>
        </div>
      `;

      // Hero Banner
      const bgImg = product.bannerImage || '/images/product-detials-images/product-details-page-banner.avif';
      html += `
        <div class="hero-banner" style="background-image: url('${bgImg}');">
          <h1 class="hero-title">${product.title}</h1>
        </div>
      `;

      // Sections
      if (product.sections && product.sections.length > 0) {
        product.sections.forEach(sec => {
          html += `<div class="section-block">`;

          // Header
          if (sec.heading) {
            html += `
              <div class="section-header">
                <h2 class="section-title">${sec.heading}</h2>
              </div>
            `;
          }

          // Paragraphs
          if (sec.paragraphs) {
            sec.paragraphs.forEach(p => {
              html += `<p class="section-p">${p}</p>`;
            });
          }

          // Bullets / Points Grid
          if (sec.bullets && sec.bullets.length > 0) {
            if (sec.bulletsIntro) {
              html += `<p style="font-weight: 600; color: #1e293b;">${sec.bulletsIntro}</p>`;
            }
            html += `<div class="points-grid">`;
            sec.bullets.forEach(b => {
              const { title, desc } = splitPointItem(b);
              html += `
                <div class="point-card">
                  ${title ? `<h5 class="point-title">${title}</h5>` : ''}
                  ${desc ? `<p class="point-desc">${desc}</p>` : ''}
                </div>
              `;
            });
            html += `</div>`;
          }

          // Table
          if (sec.table) {
            html += `
              <div class="table-container">
                <table class="data-table">
                  <thead>
                    <tr>
                      ${sec.table.headers.map(th => `<th>${th}</th>`).join('')}
                    </tr>
                  </thead>
                  <tbody>
                    ${sec.table.rows.map(row => {
                      if (Array.isArray(row.cells)) {
                        return `<tr>${row.cells.map((cell, idx) => `<td class="${idx === 0 ? 'table-first-col' : ''}">${cell}</td>`).join('')}</tr>`;
                      }
                      return `
                        <tr>
                          <td>${row.code || '—'}</td>
                          ${row.description !== undefined ? `<td>${row.description}</td>` : ''}
                          ${row.thickness !== undefined ? `<td>${row.thickness}</td>` : ''}
                          ${row.reweld !== undefined ? `<td>${row.reweld}</td>` : ''}
                          ${row.radial !== undefined ? `<td>${row.radial}</td>` : ''}
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
              </div>
              ${sec.table.footnote ? `<p class="table-footnote">${sec.table.footnote}</p>` : ''}
            `;
          }

          html += `</div>`;
        });
      }

      main.innerHTML = html;
    }

    function renderMatrixView() {
      const main = document.getElementById('mainContent');
      let html = `
        <div style="margin-bottom: 2rem;">
          <h2 style="font-size: 1.8rem; font-weight: 800; color: var(--primary-navy); margin-bottom: 0.5rem;">
            PART I & II: TXCO Product Range & Types Architecture (PDF Master Reference)
          </h2>
          <p style="color: var(--text-muted); font-size: 0.95rem;">
            Complete verbatim product range, variants, and engineering specifications extracted directly from Pages 1 to 3 of the technical specification document.
          </p>
        </div>
      `;

      PDF_OVERVIEW.forEach(cat => {
        html += `
          <div class="matrix-section">
            <div class="matrix-header">
              <h3 class="matrix-title">${cat.category}</h3>
              <span class="matrix-page-tag">PDF ${cat.pdfPage}</span>
            </div>
            <p class="matrix-desc">${cat.description}</p>
            <div class="table-container">
              <table class="data-table">
                <thead>
                  <tr>
                    <th style="width: 70px;">S. No.</th>
                    <th style="width: 320px;">Product Name</th>
                    <th>Types / Variants / Materials (Verbatim from PDF)</th>
                  </tr>
                </thead>
                <tbody>
                  ${cat.items.map(item => `
                    <tr>
                      <td style="font-weight: 700; color: var(--text-muted);">${item.no}</td>
                      <td style="font-weight: 700; color: var(--primary-navy);">${item.product}</td>
                      <td><span style="background: #f1f5f9; padding: 0.3rem 0.6rem; border-radius: 6px; font-weight: 500; color: #334155;">${item.types}</span></td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      });

      main.innerHTML = html;
    }

    function handleSearch(query) {
      if (!query || query.trim() === '') {
        if (currentViewMode === 'detailed') renderProductContent();
        else renderMatrixView();
        return;
      }

      const q = query.toLowerCase().trim();
      const main = document.getElementById('mainContent');
      let resultsHtml = `<div style="margin-bottom: 1.5rem;"><h2 style="font-size: 1.4rem; color: var(--primary-navy);">Search Results for "${query}"</h2></div>`;
      let matches = 0;

      Object.keys(CATALOG_DATA).forEach(catKey => {
        const cat = CATALOG_DATA[catKey];
        Object.keys(cat.productDetails).forEach(prodKey => {
          const prod = cat.productDetails[prodKey];
          const textToSearch = JSON.stringify(prod).toLowerCase();

          if (textToSearch.includes(q)) {
            matches++;
            resultsHtml += `
              <div class="matrix-section" style="cursor: pointer;" onclick="currentCategoryKey='${catKey}'; selectProduct('${prodKey}'); setViewMode('detailed');">
                <div class="matrix-header">
                  <h3 class="matrix-title">${prod.title}</h3>
                  <span class="matrix-page-tag">${cat.subcategoryTitle}</span>
                </div>
                <p style="font-size: 0.88rem; color: #64748b;">Click to open full product specification sheet</p>
              </div>
            `;
          }
        });
      });

      if (matches === 0) {
        resultsHtml += '<p style="color: var(--text-muted); padding: 2rem; text-align: center;">No matching products found.</p>';
      }

      main.innerHTML = resultsHtml;
    }

    // Launch
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
